name: Publicar release macOS

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Importar certificado Developer ID
        env:
          CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "$CERTIFICATE_BASE64" | base64 --decode > certificate.p12
          security create-keychain -p temporary "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p temporary "$KEYCHAIN_PATH"
          security import certificate.p12 -k "$KEYCHAIN_PATH" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k temporary "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -d user -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
      - name: Preparar herramientas de conversión de YouTube
        run: Tools/download-youtube-tools.sh
      - name: Firmar herramientas de conversión locales
        run: |
          YT_DLP_PATH="Siyahamba/Resources/YouTubeTools.bundle/yt-dlp/yt-dlp_macos"
          codesign --force --options runtime --timestamp --entitlements Scripts/yt-dlp.entitlements --sign "Developer ID Application" --keychain "$KEYCHAIN_PATH" "$YT_DLP_PATH"
          codesign --verify --strict --verbose=2 "$YT_DLP_PATH"
          for tool in ffmpeg-arm64 ffmpeg-x86_64; do
            path="Siyahamba/Resources/YouTubeTools.bundle/${tool}"
            codesign --force --options runtime --timestamp --sign "Developer ID Application" --keychain "$KEYCHAIN_PATH" "$path"
            codesign --verify --strict --verbose=2 "$path"
          done
      - name: Archivar y exportar
        timeout-minutes: 25
        run: |
          xcodebuild -resolvePackageDependencies -project Siyahamba.xcodeproj -scheme Siyahamba
          xcodebuild archive -project Siyahamba.xcodeproj -scheme Siyahamba -configuration Release -archivePath "$PWD/build/Siyahamba.xcarchive" CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="Developer ID Application" DEVELOPMENT_TEAM=89ZFGW6H88 OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH"
          xcodebuild -exportArchive -archivePath "$PWD/build/Siyahamba.xcarchive" -exportPath "$PWD/build/export" -exportOptionsPlist Scripts/export-options-developer-id.plist
          APP_PATH="build/export/Siyahamba.app"
          TOOLS_PATH="$APP_PATH/Contents/Resources/YouTubeTools.bundle"
          for tool in yt-dlp/yt-dlp_macos deno-arm64 deno-x86_64 ffmpeg-arm64 ffmpeg-x86_64; do
            test -x "$TOOLS_PATH/${tool}"
          done

          # exportArchive vuelve a firmar los Mach-O de Resources y elimina los entitlements
          # de yt-dlp. El ejecutable PyInstaller necesita cargar su Python extraído y, sin
          # esta excepción, Hardened Runtime lo bloquea por pertenecer a otro Team ID.
          YT_DLP_PATH="$TOOLS_PATH/yt-dlp/yt-dlp_macos"
          codesign --force --options runtime --timestamp --entitlements Scripts/yt-dlp.entitlements --sign "Developer ID Application" --keychain "$KEYCHAIN_PATH" "$YT_DLP_PATH"
          codesign --force --options runtime --timestamp --preserve-metadata=identifier,entitlements,requirements --sign "Developer ID Application" --keychain "$KEYCHAIN_PATH" "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

          codesign -d --entitlements :- "$YT_DLP_PATH" > "$RUNNER_TEMP/yt-dlp-entitlements.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.cs.disable-library-validation' "$RUNNER_TEMP/yt-dlp-entitlements.plist")" = "true"
          "$YT_DLP_PATH" --version
          "$TOOLS_PATH/ffmpeg-$(uname -m)" -version

          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" build/notarization.zip
      - name: Notarizar
        timeout-minutes: 30
        env:
          API_KEY_BASE64: ${{ secrets.APPSTORE_CONNECT_API_KEY_BASE64 }}
          KEY_ID: ${{ secrets.APPSTORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_ISSUER_ID }}
        run: |
          echo "$API_KEY_BASE64" | base64 --decode > AuthKey.p8
          xcrun notarytool submit build/notarization.zip --key AuthKey.p8 --key-id "$KEY_ID" --issuer "$ISSUER_ID" --wait
      - name: Grapar y verificar
        run: |
          xcrun stapler staple build/export/Siyahamba.app
          spctl --assess --type execute --verbose build/export/Siyahamba.app
      - name: Descargar ZIP previo para delta Sparkle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! previous_tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null)"; then
            echo "No hay release estable previa. Se publicará solo el ZIP completo."
            exit 0
          fi

          mkdir -p .build/previous-release
          if ! gh release download "$previous_tag" --repo "$GITHUB_REPOSITORY" --pattern 'Siyahamba-*.zip' --dir .build/previous-release; then
            echo "No se pudo descargar el ZIP de $previous_tag. Se publicará solo el ZIP completo."
            exit 0
          fi

          previous_archive="$(find .build/previous-release -maxdepth 1 -type f -name 'Siyahamba-*.zip' -print -quit)"
          if [[ -z "$previous_archive" ]]; then
            echo "La release $previous_tag no tiene un ZIP compatible. Se publicará solo el ZIP completo."
            exit 0
          fi
          echo "PREVIOUS_ARCHIVE=$GITHUB_WORKSPACE/$previous_archive" >> "$GITHUB_ENV"

          if git fetch --depth=1 origin "refs/tags/$previous_tag:refs/tags/$previous_tag" && \
            git diff --quiet "$previous_tag" HEAD -- Siyahamba/Resources/YouTubeTools.bundle Tools/download-youtube-tools.sh; then
            echo "CHECK_DELTA_SIZE=true" >> "$GITHUB_ENV"
          else
            echo "CHECK_DELTA_SIZE=false" >> "$GITHUB_ENV"
          fi
      - name: Crear ZIP y appcast Sparkle
        env:
          SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
          APP_PATH: ${{ github.workspace }}/build/export/Siyahamba.app
          SPARKLE_BIN: ${{ github.workspace }}/.build/sparkle-bin
          DOWNLOAD_URL_PREFIX: https://github.com/dmartorell/strata/releases/download/${{ github.ref_name }}/
          PREVIOUS_ARCHIVE: ${{ env.PREVIOUS_ARCHIVE }}
        run: |
          mkdir -p .build/sparkle-bin
          cp -R "$HOME/Library/Developer/Xcode/DerivedData"/*/SourcePackages/artifacts/sparkle/Sparkle/bin/. .build/sparkle-bin/
          chmod +x Scripts/release_appcast.sh .build/sparkle-bin/*
          Scripts/release_appcast.sh
      - name: Validar delta Sparkle
        run: |
          set -euo pipefail
          shopt -s nullglob
          deltas=(dist/*.delta)
          if (( ${#deltas[@]} == 0 )); then
            echo "No se generó delta. Se publicará el ZIP completo como fallback."
            exit 0
          fi

          full_size="$(stat -f%z dist/Siyahamba-*.zip)"
          for delta in "${deltas[@]}"; do
            grep -Fq "$(basename "$delta")" dist/appcast.xml
            if [[ "${CHECK_DELTA_SIZE:-false}" == "true" ]]; then
              delta_size="$(stat -f%z "$delta")"
              test "$delta_size" -lt $((full_size / 4))
            fi
          done
      - name: Publicar GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          assets=(dist/Siyahamba-*.zip dist/*.delta)
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" --generate-notes
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
